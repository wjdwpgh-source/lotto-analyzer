yaml
name: update-data
on: {schedule: [{cron: "0 0 * * 0"}, {cron: "0 12 * * 0"}, {cron: "0 0 * * 1"}], workflow_dispatch: {inputs: {mode: {description: "incremental / audit / audit-fix / seed / rebuild", default: incremental, type: choice, options: [incremental, audit, audit-fix, seed, rebuild]}}}}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run updater
        run: |
          case "${{ github.event.inputs.mode }}" in
            rebuild)   python scripts/update.py --rebuild ;;
            seed)      python scripts/update.py --source seed ;;
            audit)     python scripts/update.py --audit ;;
            audit-fix) python scripts/update.py --audit --fix ;;
            *)         python scripts/update.py ;;
          esac
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data: update lotto645" && git push)
